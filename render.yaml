# Deploy the admin backend to Render: https://render.com/docs/blueprint-spec
# Dashboard:  https://<service>.onrender.com
# App config: https://<service>.onrender.com/api/config

databases:
  - name: sdl-admin-db
    databaseName: sdl
    user: sdl
    plan: free

services:
  - type: web
    name: sdl-admin
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sdl-admin-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
