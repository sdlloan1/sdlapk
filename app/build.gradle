plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.sdl.loanapp'
    compileSdk 35

    defaultConfig {
        applicationId "com.sdl.loanapp"
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName "1.2"

        // Base URL of the admin backend (see server/). Empty = built-in defaults only.
        def configApi = (project.findProperty('SDL_CONFIG_API') ?: '').toString()
        buildConfigField "String", "CONFIG_API", "\"${configApi}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
}
